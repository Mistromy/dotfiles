set -g mouse on

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:sixel"
set -g allow-passthrough on
set -g history-limit 15000

set -g allow-rename off

bind -n MouseDown1Pane select-pane
bind -n MouseDrag1Pane if -F "#{mouse_any_flag}" "if -F \"#{pane_in_mode}\" \"copy-mode -M\" \"send-keys -M\"" "copy-mode -M"

set -g set-clipboard on
bind -T copy-mode-vi C-c send -X copy-selection-and-cancel
bind -T copy-mode    C-c send -X copy-selection-and-cancel

# vim nav
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set -g mode-keys vi

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'rose-pine/tmux'
set -g @rose_pine_variant 'main' # Options are 'main', 'moon' or 'dawn'
set -g @rose_pine_disable_active_window_menu 'on'


set -g @plugin 'tmux-plugins/tmux-battery'
# set -g status-right '#{battery_icon} #{battery_percentage} | %a %h-%d %H:%M '
set -g @rose_pine_status_right_prepend_section '#{battery_icon} #{battery_percentage} | %a %h-%d %H:%M '

run '~/.tmux/plugins/tpm/tpm'
